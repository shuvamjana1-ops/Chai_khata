    <script>
      (function () {
        try {
          var OrigWebSocket = window.WebSocket;
          if (typeof OrigWebSocket === 'function') {
            var PatchedWebSocket = function (url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                protocols === 'vite-ping' ||
                (typeof url === 'string' && url.indexOf('token=') !== -1)
              ) {
                var target = new EventTarget();
                target.readyState = 1;
                target.protocol = protocols || '';
                target.url = String(url || '');
                target.send = function () {};
                target.close = function () {
                  target.readyState = 3;
                };
                setTimeout(function () {
                  var evt = new Event('open');
                  if (typeof target.onopen === 'function') target.onopen(evt);
                  target.dispatchEvent(evt);
                }, 0);
                return target;
              }
              return protocols !== undefined
                ? new OrigWebSocket(url, protocols)
                : new OrigWebSocket(url);
            };
            PatchedWebSocket.prototype = OrigWebSocket.prototype;
            PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
            PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
            PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
            window.WebSocket = PatchedWebSocket;
          }

          var origFetch = window.fetch;
          if (typeof origFetch === 'function') {
            var currentFetch = origFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
          window.addEventListener(
            'error',
            function (e) {
              if (e && e.filename && String(e.filename).indexOf('chrome-extension://') === 0) {
                e.stopImmediatePropagation();
                e.preventDefault();
              }
            },
            true
          );
          window.addEventListener(
            'unhandledrejection',
            function (e) {
              var msg = e && e.reason && (e.reason.message || String(e.reason));
              if (msg && String(msg).indexOf('WebSocket closed without opened') !== -1) {
                e.stopImmediatePropagation();
                e.preventDefault();
              }
            },
            true
          );
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function () {});
          }
        } catch (_err) {
          // ignore
        }
      })();
    </script>
